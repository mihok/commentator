<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta
      http-equiv="Content-Security-Policy"
      content="default-src 'self'; script-src 'self'; style-src 'self'; media-src 'self' blob: mediastream:; img-src 'self' data:"
    />
    <title>Commentator</title>
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <div id="card" class="card">
      <header class="bar">
        <span class="dot" aria-hidden="true"></span>
        <span id="state" class="state off">OFF AIR</span>
        <span id="persona-name" class="name">Commentator</span>
        <span id="eq" class="eq" aria-hidden="true"><i></i><i></i><i></i><i></i><i></i></span>
        <span id="airtime" class="airtime">00:00</span>
      </header>

      <section class="hype" aria-label="Hype meter">
        <span class="label">HYPE</span>
        <span class="track"><span id="hype-fill" class="fill" data-level="low"></span></span>
        <span id="hype-value" class="value">0</span>
      </section>

      <section class="captions" aria-live="polite">
        <p id="caption" class="caption"></p>
        <p id="you" class="you"></p>
      </section>

      <p id="error" class="error" role="alert"></p>

      <footer class="foot">
        <div class="ticker"><span id="ticker-text">NOW PLAYING  ·  Pre-game warmups</span></div>
        <div id="chips" class="chips"></div>
        <div class="buttons">
          <button id="btn-mic" class="btn" title="Mute your mic (Ctrl/Cmd+Alt+M)" aria-label="Toggle microphone">
            <svg viewBox="0 0 24 24"><path d="M12 15a3 3 0 0 0 3-3V6a3 3 0 1 0-6 0v6a3 3 0 0 0 3 3Zm5-3a5 5 0 0 1-10 0H5a7 7 0 0 0 6 6.92V21h2v-2.08A7 7 0 0 0 19 12h-2Z"/></svg>
          </button>
          <button id="btn-cams" class="btn" title="Pause screen watching (Ctrl/Cmd+Alt+P)" aria-label="Toggle screen watching">
            <svg viewBox="0 0 24 24"><path d="M15 8.5V7a2 2 0 0 0-2-2H4a2 2 0 0 0-2 2v10a2 2 0 0 0 2 2h9a2 2 0 0 0 2-2v-1.5l5 3.5V5l-5 3.5Z"/></svg>
          </button>
          <button id="btn-hide" class="btn" title="Hide overlay (Ctrl/Cmd+Alt+H)" aria-label="Hide overlay">
            <svg viewBox="0 0 24 24"><path d="M5 11h14v2H5z"/></svg>
          </button>
          <button id="btn-quit" class="btn" title="End broadcast (Ctrl/Cmd+Alt+Q)" aria-label="Quit">
            <svg viewBox="0 0 24 24"><path d="M6.4 5 5 6.4 10.6 12 5 17.6 6.4 19l5.6-5.6 5.6 5.6 1.4-1.4-5.6-5.6L19 6.4 17.6 5 12 10.6 6.4 5Z"/></svg>
          </button>
        </div>
      </footer>
    </div>

    <audio id="remote-audio" autoplay></audio>
    <script type="module" src="app.js"></script>
  </body>
</html>
